name: context_hub_client
description: "ContextHubのMac・Android用Markdownクライアント"
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.11.3

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  path: ^1.9.1
  unorm_dart: ^0.3.3
  uuid: ^4.6.0
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/sample.json
    - assets/review.json
    - assets/scoped-policy.json
